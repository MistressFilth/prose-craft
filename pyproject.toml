[project]
name = "prose-craft"
version = "0.7.9"
description = "pydantic-ai engine for designing and applying prose voices"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pydantic-ai-slim>=2.18",
    "pydantic-ai-harness[code-mode,dynamic-workflow]>=0.1",
    "typer>=0.12",
    "fastmcp>=2.0",
    "mcp>=1.0",
    "pyyaml>=6.0.3",
    "rich>=13",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0",
    "pydantic-settings[toml]>=2.14.2,<3",
    "platformdirs>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "ty>=0.0.65",
    "respx>=0.21",
    "pre-commit>=4.6.1",
]

[project.scripts]
prose = "prose_craft.cli:app"
prose-craft = "prose_craft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prose_craft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
filterwarnings = [
    # VoiceProfile.register shadows BaseModel.register; this is an intentional
    # field name choice (D3 of the voice profile schema) and the warning is
    # emitted unconditionally by Pydantic v2 (see pydantic/_internal/_fields.py).
    # The field never collides at runtime (register() on BaseModel is the
    # deprecated abc virtual-subclass hook; VoiceProfile.register is a data
    # field). Suppress the noise to keep test output pristine.
    "ignore:Field name \"register\" in \".*\" shadows an attribute in parent \"BaseModel\":UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ty.src]
include = ["src/prose_craft"]
