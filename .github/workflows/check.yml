name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  matrix-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on the Windows runner, so the same make targets work
        # on all three platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make init
      - run: make check
      - name: Install pywin32 (Windows ACL helper dep)
        if: runner.os == 'Windows'
        shell: bash
        run: uv pip install --system pywin32
      - run: make test

      # Catches commits that bypassed local hooks with `git commit --no-verify`.
      # Runs the same hooks as the developer's pre-commit install would, against
      # every file in the tree, on every OS in the matrix.
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  # The aggregating gate. Branch protection requires a status context
  # named exactly "check"; a matrix job reports as "check (<os>)" and
  # would never satisfy it. Keeping the required context on a separate
  # single job means the platform list can change without touching
  # branch protection.
  check:
    needs: matrix-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every platform succeeded
        run: |
          result='${{ needs.matrix-check.result }}'
          echo "matrix-check result: $result"
          test "$result" = "success"
